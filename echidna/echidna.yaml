# Echidna campaign for echidna/ForwarderEchidna.sol (property mode).
# Run from the repository root (solc 0.8.30 through solc-select):
#   SOLC_VERSION=0.8.30 echidna echidna/ForwarderEchidna.sol --contract ForwarderEchidna --config echidna/echidna.yaml
testMode: property
testLimit: 500000
seqLen: 100
shrinkLimit: 5000
seed: 1280263521
deployer: "0x30000"
sender: ["0x10000", "0x20000"]
corpusDir: "echidna/corpus"
coverage: true
coverageFormats: ["txt"]
cryticArgs:
  - "--solc-remaps"
  - "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/ forge-std/=lib/forge-std/src/"
  - "--solc-args"
  - "--evm-version cancun --optimize --optimize-runs 200 --allow-paths ."
