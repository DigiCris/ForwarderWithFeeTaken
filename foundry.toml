[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
auto_detect_solc = false
# EIP-1153 (TSTORE/TLOAD) is required by ReentrancyGuardTransient. Base supports it since the Ecotone upgrade.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "ipfs"
cbor_metadata = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1000
seed = "0x4c756361"

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

# Deeper campaign used for the audit evidence (see audit/FINAL_AUDIT_REPORT.md).
[profile.deep.fuzz]
runs = 50000
seed = "0x4c756361"

[profile.deep.invariant]
runs = 1000
depth = 200
fail_on_revert = true

[lint]
# Test doubles intentionally mimic third-party token ABIs (lowercase constants, etc.).
ignore = ["test/mocks/*.sol"]

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
