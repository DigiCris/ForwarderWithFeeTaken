{
    "files": [
        "certora/harness/ForwarderHarness.sol",
        "certora/harness/DummyUSDC.sol",
        "certora/harness/DummyVault.sol",
        "certora/harness/DummyVault2.sol"
    ],
    "verify": "ForwarderHarness:certora/specs/ForwarderV3.spec",
    "link": [
        "DummyVault:underlying=DummyUSDC",
        "DummyVault2:underlying=DummyUSDC"
    ],
    "packages": [
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts"
    ],
    "solc": "solc",
    "solc_evm_version": "cancun",
    "solc_optimize": "200",
    "optimistic_loop": true,
    "loop_iter": "3",
    "optimistic_fallback": true,
    "rule_sanity": "basic",
    "server": "production",
    "msg": "Forwarder V3 fee calculation and overrides",
    "precise_bitwise_ops": true,
    "rule": [
        "pausedFeeIsZero",
        "feeMatchesSpecification",
        "fixedModelIsReachable",
        "percentModelIsReachable",
        "fixedPlusPercentModelIsReachable",
        "lowerModelUpToThreshold",
        "upperModelAboveThreshold",
        "percentUsesWholeAmount",
        "percentUsesWholeAmountIsNotTheExcessFee",
        "feeMatchesSpecificationForAnyConfiguration",
        "percentAboveThresholdUsesWholeAmount",
        "percentAboveThresholdIsNotExcessFee",
        "fixedModelChargesAfterConfiguration",
        "fixedPlusPercentModelChargesAfterConfiguration",
        "pausedEffectiveFeeIsZero",
        "effectiveFeeMatchesSpecification",
        "effectiveFeeNeverExceedsGlobalFee",
        "expiredOverrideIsTheGlobalFee",
        "effectiveFeeMatchesSpecificationForAnyConfiguration",
        "effectiveFeeFollowsLaterGlobalChanges",
        "discountedFeeIsReachable",
        "onlyFeeManagerSetsOverrides",
        "setUserFeeOverrideValidation",
        "setUserFeeOverrideLiveness",
        "activeOverrideIsNeverWorsened",
        "overridesOnlyChangeThroughSetUserFeeOverride",
        "setUserFeeOverrideTouchesOnlyThatOverride"
    ],
    "prover_args": [
        "-enableStorageSplitting false"
    ]
}
