{
    "files": [
        "certora/harness/ForwarderHarness.sol",
        "certora/harness/DummyUSDC.sol",
        "certora/harness/DummyVault.sol",
        "certora/harness/DummyVault2.sol"
    ],
    "verify": "ForwarderHarness:certora/specs/ForwarderV3.spec",
    "link": [
        "DummyVault:underlying=DummyUSDC",
        "DummyVault2:underlying=DummyUSDC"
    ],
    "packages": [
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts"
    ],
    "solc": "solc",
    "solc_evm_version": "cancun",
    "solc_optimize": "200",
    "optimistic_loop": true,
    "loop_iter": "3",
    "optimistic_fallback": true,
    "rule_sanity": "basic",
    "server": "production",
    "msg": "Forwarder V3 fee comparisons: decomposition and recheck (run 3)",
    "precise_bitwise_ops": true,
    "rule": [
        "productIsMonotone",
        "percentPartIsMonotone",
        "specFeeIsMonotone",
        "effectiveSpecFeeNeverExceedsGlobalSpecFee",
        "effectiveFeeNeverExceedsGlobalFeeAssisted",
        "effectiveFeeFollowsLaterGlobalChangesAssisted",
        "forwardUserReceivesAmountMinusEffectiveFeeForAnyConfiguration",
        "effectiveFeeNeverExceedsGlobalFee",
        "effectiveFeeFollowsLaterGlobalChanges",
        "forwardUserReceivesAmountMinusFeeForAnyConfiguration"
    ],
    "prover_args": [
        "-enableStorageSplitting false"
    ],
    "smt_timeout": "1800",
    "global_timeout": "7000"
}
