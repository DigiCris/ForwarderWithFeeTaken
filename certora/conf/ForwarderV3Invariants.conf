{
    "files": [
        "certora/harness/ForwarderHarness.sol",
        "certora/harness/DummyUSDC.sol",
        "certora/harness/DummyVault.sol",
        "certora/harness/DummyVault2.sol"
    ],
    "verify": "ForwarderHarness:certora/specs/ForwarderV3.spec",
    "link": [
        "DummyVault:underlying=DummyUSDC",
        "DummyVault2:underlying=DummyUSDC"
    ],
    "packages": [
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts"
    ],
    "solc": "solc",
    "solc_evm_version": "cancun",
    "solc_optimize": "200",
    "optimistic_loop": true,
    "loop_iter": "3",
    "optimistic_fallback": true,
    "rule_sanity": "basic",
    "server": "production",
    "msg": "Forwarder V3 invariants",
    "precise_bitwise_ops": true,
    "rule": [
        "enumsAreValid",
        "feeCaps",
        "vaultModeHasVault",
        "treasuryIsValid",
        "feeManagerAdminIsDefaultAdmin",
        "directDirectMeansNoVaultAllowance",
        "guardianAdminIsDefaultAdmin",
        "pendingVaultConsistency",
        "pendingVaultIsNotActive",
        "pendingVaultHasNoAllowance",
        "pendingFeeEnumsAreValid",
        "pendingFeeCaps",
        "pendingFeeConsistency",
        "pendingTreasuryConsistency",
        "pendingTreasuryIsValid",
        "zeroAddressHasNoOverride"
    ],
    "prover_args": [
        "-enableStorageSplitting false"
    ]
}
