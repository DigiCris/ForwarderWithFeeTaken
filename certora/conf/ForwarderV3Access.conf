{
    "files": [
        "certora/harness/ForwarderHarness.sol",
        "certora/harness/DummyUSDC.sol",
        "certora/harness/DummyVault.sol",
        "certora/harness/DummyVault2.sol"
    ],
    "verify": "ForwarderHarness:certora/specs/ForwarderV3.spec",
    "link": [
        "DummyVault:underlying=DummyUSDC",
        "DummyVault2:underlying=DummyUSDC"
    ],
    "packages": [
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts"
    ],
    "solc": "solc",
    "solc_evm_version": "cancun",
    "solc_optimize": "200",
    "optimistic_loop": true,
    "loop_iter": "3",
    "optimistic_fallback": true,
    "rule_sanity": "basic",
    "server": "production",
    "msg": "Forwarder V3 access control",
    "precise_bitwise_ops": true,
    "rule": [
        "onlyFeeManagerChangesFeeConfig",
        "onlyAdminChangesTreasury",
        "onlyAdminChangesVault",
        "onlyAdminChangesRoutingMode",
        "onlyAdminUnpauses",
        "onlyPrivilegedPause",
        "feeManagerCannotAdminister",
        "unprivilegedChangesNoConfiguration",
        "feeManagerRoleOnlyChangedByAdminOrSelf",
        "guardianRoleOnlyChangedByAdminOrSelf",
        "guardianCanOnlyCancel",
        "feeManagerCannotTouchTheTreasury",
        "adminWithoutFeeRoleCannotChangeFees"
    ],
    "prover_args": [
        "-enableStorageSplitting false"
    ]
}
