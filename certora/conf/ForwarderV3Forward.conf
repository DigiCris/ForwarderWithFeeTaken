{
    "files": [
        "certora/harness/ForwarderHarness.sol",
        "certora/harness/DummyUSDC.sol",
        "certora/harness/DummyVault.sol",
        "certora/harness/DummyVault2.sol"
    ],
    "verify": "ForwarderHarness:certora/specs/ForwarderV3.spec",
    "link": [
        "DummyVault:underlying=DummyUSDC",
        "DummyVault2:underlying=DummyUSDC"
    ],
    "packages": [
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts"
    ],
    "solc": "solc",
    "solc_evm_version": "cancun",
    "solc_optimize": "200",
    "optimistic_loop": true,
    "loop_iter": "3",
    "optimistic_fallback": true,
    "rule_sanity": "basic",
    "server": "production",
    "msg": "Forwarder V3 forward accounting, rescue and routing",
    "precise_bitwise_ops": true,
    "rule": [
        "forwardUserReceivesAmountMinusFee",
        "forwardTreasuryAccounting",
        "treasuryFailureNeverRevertsForward",
        "pausedForwardDeliversWholeAmount",
        "forwardDoesNotChangeConfiguration",
        "forwardOnlyAcceptsUsdc",
        "forwardUserReceivesAmountMinusFeeForAnyConfiguration",
        "forwardTreasuryAccountingForAnyConfiguration",
        "treasuryFailureNeverRevertsForwardForAnyConfiguration",
        "pausedForwardDeliversWholeAmountForAnyConfiguration",
        "rescueTokenOnlyToTreasury",
        "rescueNativeOnlyToTreasury",
        "routingModeAllowance",
        "forwardNeverApproves"
    ],
    "prover_args": [
        "-enableStorageSplitting false"
    ]
}
