{
    "files": [
        "certora/harness/ForwarderHarness.sol",
        "certora/harness/DummyUSDC.sol",
        "certora/harness/DummyVault.sol",
        "certora/harness/DummyVault2.sol"
    ],
    "verify": "ForwarderHarness:certora/specs/Forwarder.spec",
    "link": [
        "DummyVault:underlying=DummyUSDC",
        "DummyVault2:underlying=DummyUSDC"
    ],
    "packages": [
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts"
    ],
    "solc": "solc",
    "solc_evm_version": "cancun",
    "solc_optimize": "200",
    "optimistic_loop": true,
    "loop_iter": "3",
    "optimistic_fallback": true,
    "rule_sanity": "basic",
    "server": "production",
    "msg": "Forwarder rules (final)",
    "precise_bitwise_ops": true,
    "rule": [
        "pausedFeeIsZero",
        "feeMatchesSpecification",
        "fixedModelIsReachable",
        "percentModelIsReachable",
        "fixedPlusPercentModelIsReachable",
        "lowerModelUpToThreshold",
        "upperModelAboveThreshold",
        "percentUsesWholeAmount",
        "percentUsesWholeAmountIsNotTheExcessFee",
        "settersRejectValuesAboveCaps",
        "fixedFeeSetterRejectsValuesAboveCap",
        "onlyFeeManagerChangesFeeConfig",
        "onlyAdminChangesTreasury",
        "onlyAdminChangesVault",
        "onlyAdminChangesRoutingMode",
        "onlyAdminUnpauses",
        "onlyPrivilegedPause",
        "feeManagerCannotAdminister",
        "unprivilegedChangesNoConfiguration",
        "feeManagerRoleOnlyChangedByAdminOrSelf",
        "routingModeAllowance",
        "setVaultAllowances",
        "healthCheckUsesOnlyCallerFunds",
        "forwardNeverApproves",
        "forwardUserReceivesAmountMinusFee",
        "forwardTreasuryAccounting",
        "treasuryFailureNeverRevertsForward",
        "pausedForwardDeliversWholeAmount",
        "forwardDoesNotChangeConfiguration",
        "forwardOnlyAcceptsUsdc",
        "rescueTokenOnlyToTreasury",
        "rescueNativeOnlyToTreasury",
        "feeMatchesSpecificationForAnyConfiguration",
        "percentAboveThresholdUsesWholeAmount",
        "percentAboveThresholdIsNotExcessFee",
        "fixedModelChargesAfterConfiguration",
        "fixedPlusPercentModelChargesAfterConfiguration",
        "forwardUserReceivesAmountMinusFeeForAnyConfiguration",
        "forwardTreasuryAccountingForAnyConfiguration",
        "treasuryFailureNeverRevertsForwardForAnyConfiguration",
        "pausedForwardDeliversWholeAmountForAnyConfiguration",
        "setFeeConfigStoresConfiguration"
    ],
    "prover_args": [
        "-enableStorageSplitting false"
    ]
}
