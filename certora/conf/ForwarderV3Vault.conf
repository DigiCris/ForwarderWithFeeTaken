{
    "files": [
        "certora/harness/ForwarderHarness.sol",
        "certora/harness/DummyUSDC.sol",
        "certora/harness/DummyVault.sol",
        "certora/harness/DummyVault2.sol"
    ],
    "verify": "ForwarderHarness:certora/specs/ForwarderV3.spec",
    "link": [
        "DummyVault:underlying=DummyUSDC",
        "DummyVault2:underlying=DummyUSDC"
    ],
    "packages": [
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts"
    ],
    "solc": "solc",
    "solc_evm_version": "cancun",
    "solc_optimize": "200",
    "optimistic_loop": true,
    "loop_iter": "3",
    "optimistic_fallback": true,
    "rule_sanity": "basic",
    "server": "production",
    "msg": "Forwarder V3 vault change lifecycle (V2 rules)",
    "precise_bitwise_ops": true,
    "rule": [
        "onlyAdminProposes",
        "onlyAdminExecutes",
        "onlyAdminOrGuardianCancels",
        "guardianOrAdminCanAlwaysCancel",
        "guardianCannotProposeOrExecute",
        "feeManagerCannotAdministerVault",
        "unprivilegedCannotTouchVaultLifecycle",
        "vaultChangeDelayIs72Hours",
        "proposeStoresCandidateWithExactDelay",
        "proposeRevertsWhileAChangeIsPending",
        "executeRevertsBeforeExecutableAt",
        "executeRevertsWithoutPendingChange",
        "vaultOnlyChangesThroughExecuteAfterDelay",
        "pendingChangeCannotBeShortened",
        "guardianRoleChangesKeepPendingChange",
        "cancelClearsPendingOnly",
        "executeActivatesPendingVaultAndClearsIt",
        "failedExecutionKeepsState",
        "pendingOnlyClearedByCancelOrExecute",
        "vaultLifecycleKeepsConfiguration",
        "proposeLeavesNoCandidateAllowance",
        "executeAllowancesFollowCurrentRouting",
        "executeUsesRoutingInForceAtExecution",
        "forwardKeepsPendingChange",
        "proposeHealthCheckUsesOnlyCallerFunds",
        "executeHealthCheckUsesOnlyCallerFunds"
    ],
    "prover_args": [
        "-enableStorageSplitting false"
    ]
}
