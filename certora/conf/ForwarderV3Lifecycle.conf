{
    "files": [
        "certora/harness/ForwarderHarness.sol",
        "certora/harness/DummyUSDC.sol",
        "certora/harness/DummyVault.sol",
        "certora/harness/DummyVault2.sol"
    ],
    "verify": "ForwarderHarness:certora/specs/ForwarderV3.spec",
    "link": [
        "DummyVault:underlying=DummyUSDC",
        "DummyVault2:underlying=DummyUSDC"
    ],
    "packages": [
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts"
    ],
    "solc": "solc",
    "solc_evm_version": "cancun",
    "solc_optimize": "200",
    "optimistic_loop": true,
    "loop_iter": "3",
    "optimistic_fallback": true,
    "rule_sanity": "basic",
    "server": "production",
    "msg": "Forwarder V3 fee configuration and treasury cooling periods",
    "precise_bitwise_ops": true,
    "rule": [
        "feeChangeDelayIs72Hours",
        "onlyFeeManagerProposesFeeConfig",
        "onlyFeeManagerExecutesFeeConfig",
        "onlyAuthorizedCancelsFeeConfig",
        "authorizedCanAlwaysCancelFeeConfig",
        "proposeFeeConfigStoresExactProposal",
        "proposeFeeConfigRevertsWhileAChangeIsPending",
        "proposeFeeConfigEnforcesTheCaps",
        "executeFeeConfigRevertsBeforeExecutableAt",
        "executeFeeConfigRevertsWithoutPendingChange",
        "feeConfigOnlyChangesThroughMaturedExecution",
        "pendingFeeConfigCannotBeShortened",
        "pendingFeeConfigOnlyClearedByCancelOrExecute",
        "executeFeeConfigAppliesPendingAndClearsIt",
        "executeFeeConfigStoresProposedConfiguration",
        "failedFeeExecutionKeepsState",
        "cancelFeeConfigClearsPendingOnly",
        "feeLifecycleKeepsEverythingElse",
        "treasuryChangeDelayIs72Hours",
        "onlyAdminProposesTreasury",
        "onlyAdminExecutesTreasury",
        "onlyAdminOrGuardianCancelsTreasury",
        "guardianOrAdminCanAlwaysCancelTreasury",
        "proposeTreasuryStoresCandidateWithExactDelay",
        "proposeTreasuryRevertsWhileAChangeIsPending",
        "proposeTreasuryRejectsInvalidCandidates",
        "executeTreasuryRevertsBeforeExecutableAt",
        "executeTreasuryRevertsWithoutPendingChange",
        "treasuryOnlyChangesThroughMaturedExecution",
        "pendingTreasuryCannotBeShortened",
        "pendingTreasuryOnlyClearedByCancelOrExecute",
        "executeTreasuryActivatesPendingAndClearsIt",
        "cancelTreasuryClearsPendingOnly",
        "treasuryLifecycleKeepsEverythingElse",
        "rescueWhileTreasuryPendingPaysTheActiveTreasury",
        "forwardNeverPaysThePendingTreasury"
    ],
    "prover_args": [
        "-enableStorageSplitting false"
    ]
}
