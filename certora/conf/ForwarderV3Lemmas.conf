{
    "files": [
        "certora/harness/ForwarderHarness.sol",
        "certora/harness/DummyUSDC.sol",
        "certora/harness/DummyVault.sol",
        "certora/harness/DummyVault2.sol"
    ],
    "verify": "ForwarderHarness:certora/specs/ForwarderV3.spec",
    "link": [
        "DummyVault:underlying=DummyUSDC",
        "DummyVault2:underlying=DummyUSDC"
    ],
    "packages": [
        "@openzeppelin/contracts=lib/openzeppelin-contracts/contracts"
    ],
    "solc": "solc",
    "solc_evm_version": "cancun",
    "solc_optimize": "200",
    "optimistic_loop": true,
    "loop_iter": "3",
    "optimistic_fallback": true,
    "rule_sanity": "basic",
    "server": "production",
    "msg": "Forwarder V3 arithmetic lemmas on the contract domain and assisted comparison (run 5)",
    "precise_bitwise_ops": true,
    "rule": [
        "productIsMonotone",
        "percentPartIsMonotone",
        "specFeeIsMonotone",
        "effectiveSpecFeeNeverExceedsGlobalSpecFee",
        "effectiveFeeNeverExceedsGlobalFeeAssisted"
    ],
    "prover_args": [
        "-enableStorageSplitting false"
    ],
    "smt_timeout": "600"
}
